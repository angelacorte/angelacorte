name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "00 8 4 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Refresh publications from the curriculum bibliography
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/angelacorte/curriculum/main/biblio.bib \
            --output "${RUNNER_TEMP}/curriculum-biblio.bib"
          python3 scripts/render_publications.py \
            --bib "${RUNNER_TEMP}/curriculum-biblio.bib" \
            --home index.html \
            --archive publications.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
